# Testet das Backend und baut bei Änderungen auf master das Docker-Image, das der VPS startet.
#
# - Image: ghcr.io/nasenfahrradfahrer/personal_portfolio-backend, Tags `latest` und `sha-<commit>`.
#   Es enthält keine Wissensbasis (die holt der Container beim Start aus dem privaten Repo) und
#   darf deshalb öffentlich sein. Öffentliche Pakete und Actions in öffentlichen Repos sind kostenlos.
# - Deployment auf dem VPS bleibt bewusst manuell: sudo cv-deploy (backend/README.md, „Betrieb“).
# - Pull Requests: nur Tests und ein Probe-Build, nichts wird veröffentlicht.

name: Backend-Image bauen

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-image.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/nasenfahrradfahrer/personal_portfolio-backend

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Abhängigkeiten installieren
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: pytest

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Bei der GitHub Container Registry anmelden
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags und Labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
